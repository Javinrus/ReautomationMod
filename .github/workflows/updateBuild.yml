name: Update Build Files

on:
  workflow_dispatch:

jobs:
  updateBuild:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout ReautomationMod
        uses: actions/checkout@v5

      - name: Checkout MindustryJavaModTemplate
        uses: actions/checkout@v5
        with:
          repository: Anuken/MindustryJavaModTemplate
          path: template

      - name: Copy selected build files
        run: |
          cp template/gradlew ./gradlew
          cp template/gradlew.bat ./gradlew.bat
          cp template/build.gradle ./build.gradle
          cp template/.gitignore ./.gitignore

          mkdir -p gradle/wrapper
          cp template/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          cp template/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            gradlew \
            gradlew.bat \
            build.gradle \
            .gitignore \
            gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.properties

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Sync files from MindustryJavaModTemplate"
            git push
          fi
